name: Diagnose Elementor import once

on:
  push:
    branches:
      - diagnostic/import-direct-2026-08-15
    paths:
      - .github/workflows/diagnose-import-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked tooling
        run: npm ci --no-fund
      - name: Prepare template mount
        run: |
          mkdir -p wordpress-plugin/elementor-json-lab/.runtime/templates
          cp templates/smoke-heading.json wordpress-plugin/elementor-json-lab/.runtime/templates/
      - name: Start pinned runtime
        run: npx wp-env start
      - name: Install pinned Elementor
        run: |
          set -euxo pipefail
          npx wp-env run cli wp plugin install elementor --version=4.2.2 --activate
          npx wp-env run cli wp plugin activate elementor-json-lab
          npx wp-env run cli wp theme install hello-elementor --version=3.4.9 --activate
      - name: Show runtime and Elementor CLI help
        run: |
          set -euxo pipefail
          npx wp-env run cli wp user list --role=administrator --fields=ID,user_login,roles --format=table
          npx wp-env run cli wp elementor library import --help || true
          npx wp-env run cli wp eval 'echo is_readable("/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/templates/smoke-heading.json") ? "readable\n" : "not-readable\n";'
      - name: Run official import as discovered admin
        shell: bash
        run: |
          set -uxo pipefail
          admin_id="$(npx wp-env run cli wp user list --role=administrator --field=ID | grep -E '^[0-9]+$' | head -n1)"
          echo "ADMIN_ID=$admin_id"
          set +e
          npx wp-env run cli wp --user="$admin_id" elementor library import "/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/templates/smoke-heading.json" --returnType=ids
          rc=$?
          set -e
          echo "IMPORT_EXIT=$rc"
          npx wp-env run cli wp post list --post_type=elementor_library --post_status=any --fields=ID,post_title,post_status --format=table || true
          exit "$rc"
      - name: Stop runtime
        if: always()
        run: npx wp-env stop
