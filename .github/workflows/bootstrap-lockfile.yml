name: Bootstrap npm lockfile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Generate and verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
          test -s package-lock.json

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'elementor-json-lab-bot'
          git config user.email 'elementor-json-lab-bot@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock npm dependency graph'
          git push origin HEAD:main
