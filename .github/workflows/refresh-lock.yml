name: Refresh npm lockfile

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/refresh-lock.yml'

permissions:
  contents: write

concurrency:
  group: refresh-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched dependency audit
        run: npm audit --audit-level=high

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
          else
            git commit -m 'Refresh lockfile for patched adm-zip'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
