name: Temporary patched lock generator
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/temporary-lock-refresh.yml
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'Yolol100/elementorjson' && github.event.pull_request.head.repo.full_name == 'Yolol100/elementorjson' && github.event.pull_request.head.ref == 'quality/minimatch-glob-security-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: quality/minimatch-glob-security-20261105
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - name: Resolve patched lock, without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate exact versions and dependency installation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          for (const [name,version] of Object.entries({glob:'14.0.3',minimatch:'11.0.4'})) {
            if (p.overrides?.[name] !== version) throw Error('Unexpected override ' + name);
            const entries=Object.entries(l.packages).filter(([path])=>path==='node_modules/'+name || path.endsWith('/node_modules/'+name));
            if (!entries.length || entries.some(([,v])=>v.version!==version)) throw Error('Vulnerable dependency ' + name);
          }
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls glob minimatch @wordpress/env
          npm audit --audit-level=high --no-fund
      - name: Upload only package-lock to reviewed branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: quality/minimatch-glob-security-20261105
        shell: bash
        run: |
          set -euo pipefail
          test "$BRANCH" = quality/minimatch-glob-security-20261105
          SHA="$(gh api "repos/Yolol100/elementorjson/contents/package-lock.json?ref=$BRANCH" --jq '.sha')"
          export SHA
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('/tmp/lock-update.json',JSON.stringify({
            message:'security: regenerate pinned Elementor QA dependency lock',
            branch:process.env.BRANCH,sha:process.env.SHA,
            content:fs.readFileSync('package-lock.json').toString('base64')
          }));
          NODE
          gh api --method PUT repos/Yolol100/elementorjson/contents/package-lock.json --input /tmp/lock-update.json --jq '.commit.sha'
