name: Elementor JSON QA bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/validate.yml'
      - '.wp-env.json'
      - 'package.json'
      - 'playwright.config.js'
      - 'runtime-contract.json'
      - 'templates/**'
      - 'tests/**'
      - 'tools/**'
      - 'wordpress-plugin/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELEMENTOR_CORE_VERSION: '4.2.2'
  HELLO_ELEMENTOR_VERSION: '3.4.9'

jobs:
  bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked tooling for bootstrap
        run: npm install --no-audit --no-fund

      - name: Run source tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          find wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wordpress-plugin/elementor-json-lab/.runtime/templates
          mkdir -p wordpress-plugin/elementor-json-lab/.runtime/manifests
          mkdir -p artifacts/runtime-audit artifacts/screenshots
          shopt -s nullglob
          for file in templates/*.json; do
            cp "$file" wordpress-plugin/elementor-json-lab/.runtime/templates/
          done

      - name: Start pinned WordPress runtime
        run: npx wp-env start

      - name: Install pinned Elementor dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx wp-env run cli wp plugin install elementor --version="$ELEMENTOR_CORE_VERSION" --activate
          npx wp-env run cli wp plugin activate elementor-json-lab
          npx wp-env run cli wp theme install hello-elementor --version="$HELLO_ELEMENTOR_VERSION" --activate
          npx wp-env run cli wp rewrite structure '/%postname%/'
          npx wp-env run cli wp rewrite flush --hard

      - name: Export runtime inventory
        run: >-
          npx wp-env run cli wp ejl inventory
          --output=/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/inventory.json

      - name: Audit and render fixtures
        shell: bash
        run: |
          set -euo pipefail
          inventory='wordpress-plugin/elementor-json-lab/.runtime/inventory.json'
          shopt -s nullglob
          for file in templates/*.json; do
            filename="$(basename "$file")"
            stem="${filename%.json}"
            slug="$(printf '%s' "$stem" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
            python tools/audit_elementor_json.py "$file" --inventory "$inventory"
            npx wp-env run cli wp ejl render \
              "/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/templates/$filename" \
              --slug="$slug" --page-template=elementor_canvas \
              --output="/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/manifests/$slug.json"
          done

      - name: Generate or verify visual baselines
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests/e2e/preview.spec.js-snapshots ]] && find tests/e2e/preview.spec.js-snapshots -type f -name '*.png' -print -quit | grep -q .; then
            npm run test:visual
          else
            npm run test:visual:update
          fi

      - name: Commit deterministic bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json tests/e2e/preview.spec.js-snapshots
          if git diff --cached --quiet; then
            echo 'Lockfile and visual baselines already stable.'
          else
            git commit -m 'Bootstrap lockfile and visual baselines'
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop
