name: Elementor JSON QA

on:
  push:
    branches:
      - main
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/validate.yml'
      - '.gitignore'
      - '.wp-env.json'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'runtime-contract.json'
      - 'docs/**'
      - 'templates/**'
      - 'target/**'
      - 'tests/**'
      - 'tools/**'
      - 'wordpress-plugin/**'
      - 'README.md'
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/validate.yml'
      - '.gitignore'
      - '.wp-env.json'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'runtime-contract.json'
      - 'docs/**'
      - 'templates/**'
      - 'target/**'
      - 'tests/**'
      - 'tools/**'
      - 'wordpress-plugin/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELEMENTOR_CORE_VERSION: '4.2.2'
  HELLO_ELEMENTOR_VERSION: '3.4.9'
  EXPECTED_WORDPRESS_VERSION: '7.0.2'
  EXPECTED_PHP_SERIES: '8.3'

jobs:
  static-audit:
    name: Static JSON audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runtime-contract.json')
          data = json.loads(p.read_text())
          assert data['repository'] == 'Yolol100/elementorjson'
          assert data['default_branch'] == 'main'
          assert data['workflow'] == '.github/workflows/validate.yml'
          assert data['role'] == 'controlled_runtime'
          assert data['evidence']['level'] == 'controlled_runtime'
          assert data['trigger']['required_when']
          assert data['trigger']['forbidden_when']
          assert data['caller']['project'] == 'project-elementor'
          assert data['caller']['domain_owner'] == 'elementor'
          assert data['caller']['connector'] == 'GitHub'
          assert data['activation']['before_run']
          assert data['activation']['readback']
          print('runtime-contract.json: valid')
          PY

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit all supplied templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/static-audit
          shopt -s nullglob
          files=(templates/*.json)
          if (( ${#files[@]} == 0 )); then
            echo 'No templates in templates/ yet.' | tee artifacts/static-audit/README.txt
            exit 0
          fi
          for file in "${files[@]}"; do
            name="$(basename "${file%.json}")"
            python tools/audit_elementor_json.py "$file" \
              --output "artifacts/static-audit/${name}.json"
            python tools/validate_elementor_deep.py "$file" \
              --output "artifacts/static-audit/${name}-deep.json"
          done

      - name: Upload static audit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: static-audit
          path: artifacts/static-audit
          if-no-files-found: warn

  runtime-preview:
    name: Elementor runtime preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Prepare artifact directories
        run: mkdir -p artifacts/dependency-audit artifacts/runtime-audit artifacts/roundtrip artifacts/screenshots

      - name: Install test tooling
        run: npm install --no-fund

      - name: Audit npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          status=0
          npm audit --audit-level=high --json > artifacts/dependency-audit/npm-audit.json || status=$?
          if (( status != 0 )); then
            cat artifacts/dependency-audit/npm-audit.json
            exit "$status"
          fi

      - name: Install Chromium Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prepare mounted runtime files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wordpress-plugin/elementor-json-lab/.runtime/templates
          mkdir -p wordpress-plugin/elementor-json-lab/.runtime/imported
          mkdir -p wordpress-plugin/elementor-json-lab/.runtime/manifests
          shopt -s nullglob
          for file in templates/*.json; do
            cp "$file" wordpress-plugin/elementor-json-lab/.runtime/templates/
          done

      - name: Start WordPress runtime
        run: npx wp-env start

      - name: Install and activate pinned QA dependencies
        shell: bash
        env:
          ELEMENTOR_PRO_LICENSE_KEY: ${{ secrets.ELEMENTOR_PRO_LICENSE_KEY }}
        run: |
          set -euo pipefail
          npx wp-env run cli wp plugin install elementor --version="$ELEMENTOR_CORE_VERSION" --activate
          npx wp-env run cli wp plugin activate elementor-json-lab
          npx wp-env run cli wp theme install hello-elementor --version="$HELLO_ELEMENTOR_VERSION" --activate

          if [[ -n "${ELEMENTOR_PRO_LICENSE_KEY:-}" ]]; then
            npx wp-env run cli composer config --global --auth http-basic.composer.elementor.com token "$ELEMENTOR_PRO_LICENSE_KEY"
            npx wp-env run cli composer config repositories.elementor composer https://composer.elementor.com
            npx wp-env run cli composer config --no-plugins allow-plugins.composer/installers true
            npx wp-env run cli composer require composer/installers --no-interaction --no-progress
            npx wp-env run cli composer require elementor/elementor-pro --no-interaction --no-progress
            npx wp-env run cli wp plugin activate elementor-pro
            npx wp-env run cli wp elementor-pro license activate "$ELEMENTOR_PRO_LICENSE_KEY"
            printf '{"enabled":true,"source":"elementor-composer-repository"}\n' > artifacts/elementor-pro-status.json
            echo 'EJL_PRO_ENABLED=1' >> "$GITHUB_ENV"
          else
            printf '{"enabled":false,"reason":"ELEMENTOR_PRO_LICENSE_KEY secret not configured"}\n' > artifacts/elementor-pro-status.json
            echo 'EJL_PRO_ENABLED=0' >> "$GITHUB_ENV"
          fi

          npx wp-env run cli wp rewrite structure '/%postname%/'
          npx wp-env run cli wp rewrite flush --hard

      - name: Export runtime widget inventory
        run: >-
          npx wp-env run cli wp ejl inventory
          --output=/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/inventory.json

      - name: Validate pinned runtime inventory
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('wordpress-plugin/elementor-json-lab/.runtime/inventory.json')
          data = json.loads(p.read_text())
          env = data.get('environment', {})
          devices = env.get('active_devices')
          breakpoints = env.get('active_breakpoints')
          widgets = data.get('widgets')
          assert data.get('schema_version') == '1.1'
          assert env.get('wordpress') == os.environ['EXPECTED_WORDPRESS_VERSION'], env
          assert str(env.get('php', '')).startswith(os.environ['EXPECTED_PHP_SERIES'] + '.'), env
          assert env.get('elementor') == os.environ['ELEMENTOR_CORE_VERSION'], env
          assert env.get('theme_version') == os.environ['HELLO_ELEMENTOR_VERSION'], env
          assert isinstance(devices, list) and 'desktop' in devices
          assert isinstance(breakpoints, dict) and breakpoints
          assert isinstance(widgets, dict) and widgets
          pro_enabled = os.environ.get('EJL_PRO_ENABLED') == '1'
          if pro_enabled:
            assert env.get('elementor_pro'), 'Pro secret was configured but Elementor Pro is absent from inventory.'
            assert any(widget.get('owner') == 'elementor-pro' for widget in widgets.values()), 'No Elementor Pro widget was registered.'
          else:
            assert not env.get('elementor_pro'), 'Elementor Pro loaded unexpectedly in Free-only mode.'
          print('runtime inventory: valid')
          print('wordpress:', env.get('wordpress'))
          print('php:', env.get('php'))
          print('elementor:', env.get('elementor'))
          print('elementor pro:', env.get('elementor_pro'))
          print('active devices:', ', '.join(str(item) for item in devices))
          print('active breakpoints:', ', '.join(str(item) for item in breakpoints.keys()))
          PY

      - name: Audit templates against registered widgets
        shell: bash
        run: |
          set -euo pipefail
          inventory='wordpress-plugin/elementor-json-lab/.runtime/inventory.json'
          shopt -s nullglob
          files=(templates/*.json)
          if (( ${#files[@]} == 0 )); then
            echo 'No templates in templates/ yet.' | tee artifacts/runtime-audit/README.txt
            exit 0
          fi
          for file in "${files[@]}"; do
            name="$(basename "${file%.json}")"
            python tools/audit_elementor_json.py "$file" \
              --inventory "$inventory" \
              --output "artifacts/runtime-audit/${name}-runtime.json"
            python tools/validate_elementor_deep.py "$file" \
              --output "artifacts/runtime-audit/${name}-deep.json"

            if [[ -f target/inventory.json ]]; then
              python tools/audit_elementor_json.py "$file" \
                --inventory target/inventory.json \
                --output "artifacts/runtime-audit/${name}-target.json"
            fi
          done

      - name: Official Template Library import and semantic roundtrip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in templates/*.json; do
            filename="$(basename "$file")"
            stem="${filename%.json}"
            runtime_source="/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/templates/$filename"
            runtime_imported="/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/imported/$filename"

            npx wp-env run cli wp elementor library import "$runtime_source" --returnType=ids
            npx wp-env run cli wp ejl export_library \
              --source-template="$runtime_source" \
              --output="$runtime_imported"

            python tools/compare_elementor_roundtrip.py \
              "$file" \
              "wordpress-plugin/elementor-json-lab/.runtime/imported/$filename" \
              --output "artifacts/roundtrip/${stem}.json"
            python tools/validate_elementor_deep.py \
              "wordpress-plugin/elementor-json-lab/.runtime/imported/$filename" \
              --output "artifacts/roundtrip/${stem}-deep.json"
          done

      - name: Audit imported templates against runtime
        shell: bash
        run: |
          set -euo pipefail
          inventory='wordpress-plugin/elementor-json-lab/.runtime/inventory.json'
          shopt -s nullglob
          for file in wordpress-plugin/elementor-json-lab/.runtime/imported/*.json; do
            filename="$(basename "$file")"
            stem="${filename%.json}"
            python tools/audit_elementor_json.py "$file" \
              --inventory "$inventory" \
              --output "artifacts/runtime-audit/${stem}-imported-runtime.json"
          done

      - name: Render imported templates into WordPress pages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in wordpress-plugin/elementor-json-lab/.runtime/imported/*.json; do
            filename="$(basename "$file")"
            stem="${filename%.json}"
            slug="$(printf '%s' "$stem" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
            npx wp-env run cli wp ejl render \
              "/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/imported/$filename" \
              --slug="$slug" \
              --page-template=elementor_canvas \
              --output="/var/www/html/wp-content/plugins/elementor-json-lab/.runtime/manifests/$slug.json"
          done

      - name: Capture cross-browser responsive screenshots
        run: npm run test:visual

      - name: Collect runtime metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f wordpress-plugin/elementor-json-lab/.runtime/inventory.json ]]; then
            cp wordpress-plugin/elementor-json-lab/.runtime/inventory.json artifacts/runtime-inventory.json
          fi
          if [[ -d wordpress-plugin/elementor-json-lab/.runtime/manifests ]]; then
            mkdir -p artifacts/render-manifests
            cp wordpress-plugin/elementor-json-lab/.runtime/manifests/*.json artifacts/render-manifests/ 2>/dev/null || true
          fi
          if [[ -d wordpress-plugin/elementor-json-lab/.runtime/imported ]]; then
            mkdir -p artifacts/imported-templates
            cp wordpress-plugin/elementor-json-lab/.runtime/imported/*.json artifacts/imported-templates/ 2>/dev/null || true
          fi

      - name: Upload runtime QA artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: elementor-runtime-qa
          path: artifacts
          if-no-files-found: warn

      - name: Deactivate Elementor Pro license
        if: always()
        shell: bash
        env:
          ELEMENTOR_PRO_LICENSE_KEY: ${{ secrets.ELEMENTOR_PRO_LICENSE_KEY }}
        run: |
          if [[ -n "${ELEMENTOR_PRO_LICENSE_KEY:-}" ]]; then
            npx wp-env run cli wp plugin is-active elementor-pro >/dev/null 2>&1 \
              && npx wp-env run cli wp elementor-pro license deactivate \
              || true
          fi

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop
