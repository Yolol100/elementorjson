name: Temporary dependency lockfile repair (feature branch only)
on:
  push:
    branches:
      - fix/playwright-contract-source-20261116
    paths:
      - package.json
      - .github/workflows/temporary-lockfile-repair.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.repository == 'Yolol100/elementorjson' && github.ref == 'refs/heads/fix/playwright-contract-source-20261116' && github.actor == 'Yolol100'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Node 24 (locked toolchain)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - name: Regenerate lockfile without executing dependency scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const pkg=require('./package.json');
          const lock=require('./package-lock.json');
          for (const [name,version] of Object.entries({ 'isomorphic-git':'1.38.6','fast-xml-parser':'5.12.0' })) {
            if(pkg.overrides?.[name] !== version || lock.packages['node_modules/'+name]?.version !== version) {
              throw new Error('Dependency security pin mismatch: '+name);
            }
          }
          NODE
          git diff --check
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile update generated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): regenerate secure transitive dependency lockfile'
          git push origin HEAD:refs/heads/fix/playwright-contract-source-20261116
